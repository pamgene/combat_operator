name: Release Workflow

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Update container in operator.json
        run: |
          jq --arg variable "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${GITHUB_REF##*/}" '.container = $variable' operator.json > operator.json.tmp
          mv operator.json.tmp operator.json

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # The install check below makes Tercen pull the image by the tagged
          # commit's short SHA, so push the SHA tags next to the version tag.
          tags: |
            type=pep440,pattern={{version}}
            type=sha,format=long,prefix=
            type=sha,prefix=

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Install check against a test Tercen instance. Runs only when the
      # TERCEN_TEST_OPERATOR_* secrets are configured for the repo/org.
      - name: Install operator
        env:
          TERCEN_URI: ${{ secrets.TERCEN_TEST_OPERATOR_URI }}
        if: env.TERCEN_URI != ''
        run: |
          docker run --rm \
            -e TERCEN_USERNAME=${{ secrets.TERCEN_TEST_OPERATOR_USERNAME }} \
            -e TERCEN_PASSWORD=${{ secrets.TERCEN_TEST_OPERATOR_PASSWORD }} \
            -e TERCEN_URI=${{ secrets.TERCEN_TEST_OPERATOR_URI }} \
            -e GITHUB_TOKEN=${{ secrets.TERCEN_GITHUB_TOKEN }} \
            tercen/tercenctl:release operator install --rm --tag ${GITHUB_SHA} --repo ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}

      - name: Create required package.json
        run: echo '{}' > package.json

      - name: Build changelog
        id: Changelog
        uses: tercen/generate-changelog-action@master

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: ${{ steps.Changelog.outputs.changelog }}
        run: |
          echo "$NOTES" > release_notes.md
          gh release create "${GITHUB_REF_NAME}" --title "Release ${GITHUB_REF_NAME}" --notes-file release_notes.md
